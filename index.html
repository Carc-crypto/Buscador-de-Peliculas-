<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Películas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CineCrypto 🎬</h1>
        <form id="formulario">
            <input type="text" id="busqueda" placeholder="Busca una película...">
            <button type="submit">Buscar</button>
        </form>
    </header>

    <main id="contenedor-peliculas" class="contenedor"></main>

        
    </main>

    
    <div id="modal-pelicula" class="modal">
        <div class="modal-contenido">
            <span class="cerrar-modal">&times;</span>
            <div class="modal-detalles">
                <img id="modal-poster" src="" alt="Poster">
                <div class="modal-texto">
                    <h2 id="modal-titulo">Título de la Película</h2>
                    <p id="modal-fecha"><strong>Fecha de estreno:</strong> <span></span></p>
                    <p id="modal-nota"><strong>Calificación:</strong> <span></span> ⭐</p>
                    <h3>Sinopsis:</h3>
                    <p id="modal-sinopsis">Texto de la sinopsis...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

</body>
</html>
